baseURL = 'https://go-sciio.github.io/'
locale  = 'en-us'
title   = 'go-sciio'
# No theme -- the layout is the go-* family template: one self-contained
# layouts/index.html, and the shared design (styles, theme toggle, fork ribbon,
# icons) imported as the Hugo module github.com/go-fleettools/landingkit,
# pinned in go.mod.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-sciio: scientific file formats in pure Go (CGO=0): HDF5, MAT, NetCDF, FITS, npy, Matrix Market, WAV and FLAC. Planned, wave 2 of the go-scikit roadmap: no library exists yet."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-sciio.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the scope of the organisation, the plan and one page per planned package. <a href=\"https://github.com/go-sciio/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-sciio/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The planned packages. None exists: each statement is from the roadmap's
# bibliography (go-scikit/roadmap, bib/systems-units-formats-visualization.md).
[[params.packages]]
  name  = "h5"
  kind  = "planned (wave 2)"
  blurb = "HDF5 (File Format Specification 3.0), reader and writer. Validated against h5py, <code>h5dump</code> and the HDF Group's example files."
[[params.packages]]
  name  = "mat"
  kind  = "planned (wave 2)"
  blurb = "MAT-files v4, v5, v7 and v7.3, the last on top of <code>h5</code>. Validated against <code>scipy.io</code> and h5py."
[[params.packages]]
  name  = "netcdf"
  kind  = "planned (wave 2)"
  blurb = "NetCDF classic (CDF-1, 2, 5) and NetCDF-4 on top of <code>h5</code>. Validated against netcdf-c's <code>ncdump</code> and its test files."
[[params.packages]]
  name  = "fits"
  kind  = "planned (wave 2)"
  blurb = "FITS 4.0: images, binary tables and compressed images. Validated against astropy.io.fits and NASA's FITS samples."
[[params.packages]]
  name  = "npy"
  kind  = "planned (wave 2)"
  blurb = "NumPy <code>.npy</code> and <code>.npz</code>. Validated against NumPy."
[[params.packages]]
  name  = "mtx"
  kind  = "planned (wave 2)"
  blurb = "Matrix Market, coordinate and array. Validated against <code>scipy.io.mmread</code>. go-sparse's wave 1 also lists Matrix Market I/O: the line between the two is yet to be drawn."
[[params.packages]]
  name  = "wav"
  kind  = "planned (wave 2)"
  blurb = "WAV, PCM and float. Validated against <code>scipy.io.wavfile</code>."
[[params.packages]]
  name  = "flac"
  kind  = "planned (wave 2)"
  blurb = "FLAC decoding (RFC 9639). Validated against the IETF working group's FLAC test files."

# The cards of #checks and their count come from this list. Each statement is
# a measure the roadmap says the work will be held to; none has been run.
[[params.checks]]
  name = "Exact reads"
  what = "Integers, strings and raw floats read back byte for byte equal to the reference reader's."
[[params.checks]]
  name = "Round trips"
  what = "Write in Go, read with h5py, astropy or SciPy, and the arrays are identical; read in Go a file those tools wrote, and the same."
[[params.checks]]
  name = "Hostile input"
  what = "`go test -fuzz` for panics, and a limit on the allocation a hostile header can ask for."

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 8.10:1, bright on the dark background 7.51:1.
  base = "#3e516b"
  deep = "#263141"
  bright = "#8fa3bf"
  shadow = "rgba(62,81,107,.7)"
  glow = "rgba(62,81,107,.6)"
  wash = "rgba(62,81,107,.10)"
  washDeep = "rgba(38,49,65,.06)"
  chipBg = "#f2f4f7"
  chipBorder = "#dde3ec"
  chipFg = "#263141"
  chipBgDark = "rgba(143,163,191,.14)"
  chipBorderDark = "rgba(143,163,191,.32)"
  chipFgDark = "#c1ccdc"
  statsEnd = "#e4e9f0"
  bandText = "#edf0f5"
